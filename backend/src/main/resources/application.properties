spring.application.name=monitoria-ufpr

# ==============================================================================
# Configuração do PostgreSQL
# ==============================================================================
# Os defaults apontam para uma instalação local. A senha nunca é versionada:
# defina SPRING_DATASOURCE_PASSWORD no ambiente antes de iniciar a aplicação.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/monitoria_ufpr}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# Redis (cache-aside)
# ==============================================================================
spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:250ms}
app.cache.redis.enabled=${APP_CACHE_REDIS_ENABLED:true}
app.cache.redis.ttl=${APP_CACHE_REDIS_TTL:PT6H}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when-authorized

# ==============================================================================
# JPA / Hibernate
# ==============================================================================
# Deixa o Flyway gerenciar o schema do banco (validate garante conformidade sem sobrescrever com ddl-auto)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================================================================
# Flyway Migrations
# ==============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==============================================================================
# Swagger / OpenAPI
# ==============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false

# ==============================================================================
# Segurança / JWT
# ==============================================================================
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:monitoria-ufpr-dev-secret-key-2026-hmac-sha256-min-32-bytes}
app.security.jwt.expiration-ms=${APP_SECURITY_JWT_EXPIRATION_MS:28800000}
