# Local development profile: no PostgreSQL or Redis installation is required.
spring.datasource.url=jdbc:h2:mem:monitoria_dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.data.redis.url=redis://localhost:6379
app.cache.redis.enabled=false
management.health.redis.enabled=false
